<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PARKnSPIN Admin</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin-top: 36px; color: #222; }
  .hint { font-size: 12px; color: #888; margin: 2px 0 10px; }
  textarea, input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; margin-top: 6px; }
  textarea { height: 160px; font-family: monospace; }
  button { margin-top: 10px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  .location-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
  .location-row a { text-decoration: none; color: #D85A30; font-weight: 500; font-size: 14px; }
</style>
</head>
<body>

<h1>PARKnSPIN Admin</h1>

<h2>Locations</h2>
<div class="hint">Paste parkrun names, one per line. Nothing else needed.</div>

<textarea id="bulkLocationsBox" placeholder="Ashgrove
Kelvin Grove
New Farm
Chermside"></textarea>
<button onclick="addLocationsBulk()">Add</button>
<div id="bulkLocationResult" style="font-size:13px; margin-top:6px;"></div>

<h2>Manage a location</h2>
<div class="hint">Each parkrun has its own page — sponsor, prize, draw time, and finisher list all live there.</div>
<div id="locationsList"></div>

<h2>Recent registrations (all locations)</h2>
<div id="recentRegs" style="font-size:13px;"></div>

<script>
async function loadLocations() {
  const res = await fetch('/api/locations');
  const locations = await res.json();
  const el = document.getElementById('locationsList');
  if (!locations.length) { el.textContent = 'No locations yet — add some above.'; return; }
  el.innerHTML = locations.map(loc =>
    `<div class="location-row">
      <span>${loc.name}</span>
      <a href="admin-location.html?location=${loc.id}">Manage \u2192</a>
    </div>`
  ).join('');
}

async function addLocationsBulk() {
  const raw = document.getElementById('bulkLocationsBox').value;
  const names = raw.split('\n');
  const resultEl = document.getElementById('bulkLocationResult');
  const res = await fetch('/api/locations/bulk', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ names })
  });
  const data = await res.json();
  if (data.error) {
    resultEl.textContent = 'Error: ' + data.error;
  } else {
    resultEl.textContent = `Added ${data.added} new location${data.added === 1 ? '' : 's'}` + (data.skipped ? `, skipped ${data.skipped} already there.` : '.');
    document.getElementById('bulkLocationsBox').value = '';
    loadLocations();
  }
}

async function loadRecentRegs() {
  const res = await fetch('/api/registrations/recent');
  const regs = await res.json();
  const el = document.getElementById('recentRegs');
  if (!regs.length) { el.textContent = 'No registrations yet.'; return; }
  el.innerHTML = regs.map(r =>
    `<div>${r.name} \u2014 ${r.mobile} \u2014 ${r.parkrun_locations ? r.parkrun_locations.name : '?'} \u2014 ${new Date(r.created_at).toLocaleString()}</div>`
  ).join('');
}

loadLocations();
loadRecentRegs();
</script>

</body>
</html>
